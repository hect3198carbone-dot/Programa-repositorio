<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reparaciones Carbone IT</title>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://tailwindcss.com"></script>
  <!-- Lucide Icons para los iconos idénticos de la imagen -->
  <script src="https://unpkg.com"></script>
</head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen antialiased selection:bg-blue-500/30">

  <div class="max-w-5xl mx-auto p-4 md:p-8">
    
    <!-- ENCABEZADO -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b border-slate-900 pb-6">
      <div>
        <div class="flex items-center gap-2.5">
          <div class="bg-blue-600/10 p-2 rounded-lg border border-blue-500/20 text-blue-400">
            <i data-lucide="wrench" class="w-5 h-5"></i>
          </div>
          <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            Reparaciones Carbone IT
          </h1>
        </div>
        <p class="text-xs text-slate-500 mt-1 ml-10">Sistema integrado de soporte y diagnóstico técnico</p>
      </div>
      
      <!-- Indicador Sincronizado original -->
      <div class="flex items-center gap-2 bg-emerald-950/30 border border-emerald-500/20 px-3.5 py-1.5 rounded-full text-xs font-medium text-emerald-400 backdrop-blur-sm self-end sm:self-auto">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Sincronizado
      </div>
    </header>

    <!-- ESTADÍSTICAS SUPERIORES -->
    <section class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-slate-900/20 border border-slate-900 p-4 rounded-xl backdrop-blur-sm flex justify-between items-start">
        <div>
          <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Pendientes</p>
          <p id="stat-pendientes" class="text-2xl font-bold text-rose-400 mt-1">0</p>
        </div>
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500/40"></i>
      </div>
      <div class="bg-slate-900/20 border border-slate-900 p-4 rounded-xl backdrop-blur-sm flex justify-between items-start">
        <div>
          <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">En Proceso</p>
          <p id="stat-proceso" class="text-2xl font-bold text-amber-400 mt-1">0</p>
        </div>
        <i data-lucide="clock" class="w-4 h-4 text-amber-500/40"></i>
      </div>
      <div class="bg-slate-900/20 border border-slate-900 p-4 rounded-xl backdrop-blur-sm flex justify-between items-start">
        <div>
          <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Completadas</p>
          <p id="stat-completadas" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
        </div>
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500/40"></i>
      </div>
    </section>

    <!-- REGISTRO -->
    <section class="bg-slate-900/10 border border-slate-900/80 rounded-xl p-5 mb-8 backdrop-blur-sm">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="plus-circle" class="w-4 h-4 text-slate-500"></i>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Registrar Dispositivo</h2>
      </div>
      <form id="formulario-reparacion" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-2">
          <input type="text" id="form-cliente" required placeholder="Cliente o Locación (Ej. Picking Milla 8)" 
                 class="w-full bg-slate-950/60 border border-slate-900 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500/50 placeholder-slate-600 transition-all">
        </div>
        <div>
          <select id="form-tipo" class="w-full bg-slate-950/60 border border-slate-900 rounded-lg px-3.5 py-2 text-sm text-slate-300 focus:outline-none focus:border-blue-500/50 transition-all">
            <option value="PDI">PDI</option>
            <option value="Laptop">Laptop</option>
            <option value="Desktop">Desktop</option>
            <option value="Impresora">Impresora</option>
          </select>
        </div>
        <div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition-all shadow-lg shadow-blue-600/10 flex items-center justify-center gap-2">
            Crear Orden
          </button>
        </div>
      </form>
    </section>

    <!-- CONTROLADORES: BUSCADOR Y FILTROS RÁPIDOS -->
    <div class="space-y-4 mb-6">
      <!-- Buscador con icono de lupa -->
      <div class="relative">
        <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-slate-600"></i>
        <input type="text" id="buscador" placeholder="Buscar por ID de reparación, cliente o MAC..." 
               class="w-full bg-slate-950 border border-slate-900 rounded-xl pl-11 pr-4 py-2.5 text-sm text-slate-300 placeholder-slate-600 focus:outline-none focus:border-blue-500/40 transition-all">
      </div>

      <!-- BOTONES DE FILTRADO IDÉNTICOS A LA IMAGEN -->
      <div class="flex flex-wrap gap-2 text-xs border-b border-slate-900 pb-4">
        <button onclick="filtrarPorTipo('Todos')" class="btn-filtro active px-3 py-1.5 rounded-lg font-medium transition-all">Todos</button>
        <button onclick="filtrarPorTipo('PDI')" class="btn-filtro px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">PDI</button>
        <button onclick="filtrarPorTipo('Laptop')" class="btn-filtro px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">Laptop</button>
        <button onclick="filtrarPorTipo('Desktop')" class="btn-filtro px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">Desktop</button>
        <button onclick="filtrarPorTipo('Impresora')" class="btn-filtro px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">Impresora</button>
      </div>
    </div>

    <!-- LISTADO DE TARJETAS -->
    <main id="lista-reparaciones" class="space-y-2.5">
      <!-- El script inyectará el HTML idéntico aquí -->
    </main>

  </div>

  <!-- ESTILOS INYECTADOS ADICIONALES -->
  <style>
    .btn-filtro.active {
      background-color: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(71, 85, 105, 0.2);
      color: #f8fafc;
    }
    .btn-filtro:not(.active) {
      border: 1px solid transparent;
    }
  </style>

  <!-- LÓGICA DE PROGRAMACIÓN -->
  <script>
    let reparaciones = JSON.parse(localStorage.getItem('reparaciones_db')) || [
      { id: "REP-20260515-CKK", tipo: "PDI", cliente: "Picking Milla 8", mac: "B4:F4:DF:52:99:A1", tiempo: "Hace 2 días", estado: "En proceso" },
      { id: "REP-20260516-ABC", tipo: "Laptop", cliente: "Sucursal Calle 50", mac: "00:1A:2B:3C:4D:5E", tiempo: "Hace 1 día", estado: "Pendiente" },
      { id: "REP-20260517-XYZ", tipo: "Desktop", cliente: "Oficina Central", mac: "A1:B2:C3:D4:E5:F6", tiempo: "Hace 3 horas", estado: "Completado" }
    ];

    let filtroTipoActual = 'Todos';

    const contenedor = document.getElementById('lista-reparaciones');
    const buscador = document.getElementById('buscador');
    const formulario = document.getElementById('formulario-reparacion');

    function actualizarEstadisticas() {
      const pendientes = reparaciones.filter(r => r.estado === "Pendiente").length;
      const proceso = reparaciones.filter(r => r.estado === "En proceso").length;
      const completadas = reparaciones.filter(r => r.estado === "Completado").length;

      document.getElementById('stat-pendientes').innerText = pendientes;
      document.getElementById('stat-proceso').innerText = proceso;
      document.getElementById('stat-completadas').innerText = completadas;
    }

    function renderizarTarjetas(lista) {
      contenedor.innerHTML = ""; 
      
      if (lista.length === 0) {
        contenedor.innerHTML = `<p class="text-center text-slate-600 text-xs py-12">No hay registros que coincidan con los criterios.</p>`;
        return;
      }
      
      lista.forEach(rep => {
        // Colores estilizados para los selectores de la lista
        let colorEstado = "bg-rose-500/5 border-rose-500/20 text-rose-400";
        if (rep.estado === "En proceso") colorEstado = "bg-amber-500/5 border-amber-500/20 text-amber-400";
        if (rep.estado === "Completado") colorEstado = "bg-emerald-500/5 border-emerald-500/20 text-emerald-400";

        // Color dinámico para el badge del tipo (Verde para PDI, Azul para Laptop, etc)
        let colorBadge = "bg-blue-500/10 text-blue-400 border-blue-500/10";
        if(rep.tipo === "PDI") colorBadge = "bg-emerald-500/10 text-emerald-400 border-emerald-500/10";

        const tarjeta = `
          <div class="bg-[#0b0f19]/40 border border-slate-900 rounded-xl p-4 flex justify-between items-center hover:border-slate-800/80 transition-all backdrop-blur-sm group">
            <div class="space-y-1">
              <div class="flex items-center gap-2.5">
                <!-- ID de reparación original en azul brillante -->
                <span class="text-blue-500 font-mono text-xs font-bold tracking-wider">${rep.id}</span>
                <!-- Badge de categoría estilizado -->
                <span class="border text-[10px] px-2 py-0.5 rounded-full font-medium ${colorBadge}">${rep.tipo}</span>
              </div>
              <h2 class="text-slate-200 font-medium text-[15px] tracking-wide">${rep.cliente}</h2>
              <!-- MAC Address secundaria tenue debajo del título -->
              <p class="text-[11px] font-mono text-slate-600 flex items-center gap-1">
                <i data-lucide="cpu" class="w-3 h-3 text-slate-700"></i> ${rep.mac}
              </p>
            </div>
            
            <div class="text-right space-y-2">
              <span class="text-[11px] text-slate-600 block font-medium">${rep.tiempo}</span>
              <select onchange="cambiarEstado('${rep.id}', this.value)" 
                      class="border text-[11px] px-2.5 py-1 rounded-lg font-semibold cursor-pointer focus:outline-none transition-all ${colorEstado}">
                <option value="Pendiente" ${rep.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                <option value="En proceso" ${rep.estado === 'En proceso' ? 'selected' : ''}>En proceso</option>
                <option value="Completado" ${rep.estado === 'Completado' ? 'selected' : ''}>Completado</option>
              </select>
            </div>
          </div>
        `;
        contenedor.innerHTML += tarjeta;
      });

      // Forzar recarga de los iconos insertados dinámicamente
      lucide.createIcons();
      actualizarEstadisticas();
    }

    function cambiarEstado(id, nuevoEstado) {
      reparaciones = reparaciones.map(rep => {
        if (rep.id === id) return { ...rep, estado: nuevoEstado };
        return rep;
      });
      localStorage.setItem('reparaciones_db', JSON.stringify(reparaciones));
      ejecutarFiltros();
    }

    function generarID() {
      const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let codigoAleatorio = "";
      for (let i = 0; i < 3; i++) {
        codigoAleatorio += letras.charAt(Math.floor(Math.random() * letras.length));
      }
      return `REP-20260519-${codigoAleatorio}`;
    }

    function generarMAC() {
      return "00:1A:2B:" + Math.floor(Math.random()*90+10) + ":" + Math.floor(Math.random()*90+10) + ":" + Math.floor(Math.random()*90+10);
    }

    formulario.addEventListener('submit', (e) => {
      e.preventDefault(); 
      const nuevoCliente = document.getElementById('form-cliente').value;
      const nuevoTipo = document.getElementById('form-tipo').value;

      const nuevaOrden = {
        id: generarID(),
        tipo: nuevoTipo,
        cliente: nuevoCliente,
        mac: generarMAC(),
        tiempo: "Ahora mismo",
        estado: "Pendiente"
      };

      reparaciones.unshift(nuevaOrden);
      localStorage.setItem('reparaciones_db', JSON.stringify(reparaciones));
      ejecutarFiltros();
      formulario.reset();
    });

    // Filtros combinados (Buscador + Fila de Botones)
    function ejecutarFiltros() {
      const texto = buscador.value.toLowerCase();
      
      const filtradas = reparaciones.filter(rep => {
        const coincideTexto = rep.cliente.toLowerCase().includes(texto) || rep.id.toLowerCase().includes(texto) || rep.mac.toLowerCase().includes(texto);
        const coincideTipo = (filtroTipoActual === 'Todos') || (rep.tipo === filtroTipoActual);
        return coincideTexto && coincideTipo;
      });

      renderizarTarjetas(filtradas);
    }

    function filtrarPorTipo(tipo) {
      filtroTipoActual = tipo;
      
      // Actualizar estilo visual activo en los botones
      const botones = document.querySelectorAll('.btn-filtro');
      botones.forEach(btn => {
        if(btn.innerText === tipo) {
          btn.classList.add('active');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('active');
          btn.classList.add('text-slate-400');
        }
      });

      ejecutarFiltros();
    }

    buscador.addEventListener('input', ejecutarFiltros);

    // Inicialización del sistema e iconos en carga inicial
    renderizarTarjetas(reparaciones);
    lucide.createIcons();
  </script>
</body>
</html>
